<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Video Player</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        #video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: #111;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #action-btn {
            position: absolute;
            bottom: -60px; /* Hidden below the container by default */
            left: 50%;
            transform: translateX(-50%);
            background-color: #ff3b3b;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: bottom 0.5s ease-in-out; /* Slide up animation */
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #action-btn:hover {
            background-color: #ff1a1a;
        }

        #action-btn.show {
            bottom: 20px; /* Slides up to this position */
        }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="myVideo" playsinline muted controls></video>
        <button id="action-btn">Next</button>
    </div>

    <script>
        // Yahan apni videos ke links aur button ki timing set karein (extensions capitalized hain)
        const playlist = [
            { url: "video1.MP4", showBtnAt: 12, btnText: "Next" },
            { url: "video2.MP4", showBtnAt: 23, btnText: "Lets go for a walk" },
            { url: "video3.MP4", showBtnAt: 20, btnText: "Next" },
            { url: "video4.MP4", showBtnAt: 13, btnText: "Next" },
            { url: "video5.MP4", showBtnAt: 5,  btnText: "Next" }, 
            { url: "video6.MP4", showBtnAt: 9,  btnText: "Next" },
            { url: "video7.MP4", showBtnAt: 9999, btnText: "" } // Last video jisme koi button nahi aayega
        ];

        let currentIndex = 0;
        let buttonShown = false;

        const videoPlayer = document.getElementById('myVideo');
        const actionBtn = document.getElementById('action-btn');

        // Pehli video load karne ke liye function
        function loadVideo(index) {
            if (index >= playlist.length) return; // Agar videos khatam ho jayein
            
            buttonShown = false;
            actionBtn.classList.remove('show'); // Button chupao
            
            videoPlayer.src = playlist[index].url;
            videoPlayer.play();
        }

        // Jab video play ho rahi ho tab time check karne ka function
        videoPlayer.addEventListener('timeupdate', () => {
            let currentVideoData = playlist[currentIndex];
            
            // Agar video ka current time bataye gaye time se zyada ho gaya aur button abhi tak nahi dikha
            if (videoPlayer.currentTime >= currentVideoData.showBtnAt && !buttonShown) {
                actionBtn.innerText = currentVideoData.btnText;
                actionBtn.classList.add('show'); // Niche se button slide up hoga
                buttonShown = true;
            }
        });

        // Jab button par click ho
        actionBtn.addEventListener('click', () => {
            currentIndex++; // Next video par jao
            loadVideo(currentIndex); // Nayi video load karo
        });

        // Start the first video
        loadVideo(currentIndex);
    </script>

</body>
</html>
